@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#06080f;--cyan:#67e8f9;--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
html{scroll-behavior:smooth}
.app{background:var(--bg);color:#cbd5e1;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden;position:relative}
.app section{position:relative;z-index:1;scroll-margin-top:72px}
.serif{font-family:var(--serif)}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(100px);animation:sway 30s ease-in-out infinite}
.tok{position:absolute;font-family:var(--mono);color:#7dd3fc;opacity:0;font-size:.95rem;animation:drift 28s ease-in-out infinite}
.pt{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px 2px rgba(103,232,249,.45);opacity:.4;animation:pulse 8s ease-in-out infinite}
.letters .ch{display:inline-block;opacity:0;transform:translateY(.55em)}
.letters.on .ch{animation:rise .9s cubic-bezier(.22,1,.36,1) both}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fade{animation:rise 1s ease both}
.reveal{opacity:0;transform:translateY(22px);transition:opacity 1s cubic-bezier(.22,1,.36,1),transform 1s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(148,163,184,.14);border-radius:.9rem;transition:border-color .5s,box-shadow .5s,transform .5s}
.card:hover{border-color:rgba(103,232,249,.4);box-shadow:0 0 32px -10px rgba(103,232,249,.35)}
.lift:hover{transform:translateY(-3px)}
.grow:hover{transform:scale(1.02)}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.6rem;border-radius:999px;font-size:.9rem;font-weight:500;color:#e2e8f0;border:1px solid rgba(148,163,184,.3);transition:box-shadow .5s,border-color .5s,transform .5s;cursor:pointer}
.btn:hover{border-color:var(--cyan);box-shadow:0 0 26px -4px rgba(103,232,249,.45);transform:translateY(-2px)}
.btn-fill{background:var(--cyan);color:#06222a;border-color:var(--cyan)}
.app a:focus-visible,.app button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.tag{font-family:var(--mono);font-size:.72rem;padding:.2rem .6rem;border-radius:999px;border:1px solid rgba(96,165,250,.3);color:#93c5fd}
.caret{display:inline-block;width:2px;height:1.05em;margin-left:3px;background:var(--cyan);vertical-align:-3px;animation:blink 1s steps(2) infinite}
.tl{position:relative;padding-left:2.5rem}
.tl-line{position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--cyan),transparent);transform-origin:top;transition:transform 1.4s cubic-bezier(.22,1,.36,1)}
.tl-dot{position:absolute;left:0;top:1.7rem;width:15px;height:15px;border-radius:50%;background:var(--bg);border:1px solid var(--cyan);box-shadow:0 0 12px rgba(103,232,249,.6)}
.btn-sm{padding:.5rem 1rem;font-size:.8rem}
.modal{animation:fadein .4s ease both}
.skip{position:absolute;left:-999px;top:0}
.skip:focus{left:12px;top:12px;z-index:100;background:var(--cyan);color:#06222a;padding:.5rem 1rem;border-radius:.5rem}
@keyframes rise{from{opacity:0;transform:translateY(.55em)}to{opacity:1;transform:none}}
@keyframes drift{0%{opacity:0;transform:translateY(30px)}25%,75%{opacity:.14}100%{opacity:0;transform:translateY(-90px)}}
@keyframes pulse{50%{opacity:.12;transform:translateY(-14px)}}
@keyframes sway{50%{transform:translate(40px,30px)}}
@keyframes blink{to{opacity:0}}
@keyframes fadein{from{opacity:0}}
